<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Checklist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, #f5c518, #e6a700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
  }
  .user-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .user-bar .current-user {
    font-size: 0.95rem;
    color: #f5c518;
    font-weight: 600;
  }
  .user-bar button {
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a2a;
    color: #ccc;
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.15s;
  }
  .user-bar button:hover { background: #252540; border-color: #555; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
    padding: 0.6rem 1.2rem;
    border-radius: 10px;
    background: #141420;
    border: 1px solid #222;
    min-width: 100px;
  }
  .stat-num { font-size: 1.5rem; font-weight: 700; }
  .stat-num.seen-c { color: #4ade80; }
  .stat-num.must-c { color: #f5c518; }
  .stat-num.rewatch-c { color: #a78bfa; }
  .stat-num.unseen-c { color: #555; }
  .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend {
    display: flex;
    justify-content: center;
    gap: 1.25rem;
    margin-bottom: 1.5rem;
    font-size: 0.8rem;
    color: #888;
    flex-wrap: wrap;
  }
  .legend span { display: flex; align-items: center; gap: 0.35rem; }
  .legend .dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }
  .dot-unseen { border: 2px solid #444; background: transparent; }
  .dot-seen { background: #4ade80; }
  .dot-must { background: #f5c518; }
  .dot-rewatch { background: #a78bfa; }
  .controls {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .controls button {
    padding: 0.4rem 0.9rem;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a2a;
    color: #ccc;
    cursor: pointer;
    font-size: 0.75rem;
    transition: all 0.15s;
  }
  .controls button:hover { background: #252540; border-color: #555; }
  .controls button.active { border-color: #f5c518; color: #f5c518; }
  .search-wrap {
    position: relative;
    margin-bottom: 1rem;
  }
  .search-wrap input {
    width: 100%;
    padding: 0.6rem 1rem 0.6rem 2.2rem;
    border-radius: 8px;
    border: 1px solid #222;
    background: #141420;
    color: #e0e0e0;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: #f5c518; }
  .search-wrap::before {
    content: '\1F50D';
    position: absolute;
    left: 0.7rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
  }
  .movie-list { list-style: none; }
  .movie-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0.75rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    user-select: none;
    border-bottom: 1px solid #161622;
  }
  .movie-item:hover { background: #161625; }
  .movie-item.state-seen .movie-name { color: #4ade80; }
  .movie-item.state-must .movie-name { color: #f5c518; font-weight: 600; }
  .movie-item.state-rewatch .movie-name { color: #a78bfa; }
  .movie-item.state-unseen .movie-name { color: #777; }
  .check-box {
    width: 22px; height: 22px; min-width: 22px;
    border-radius: 6px;
    border: 2px solid #444;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    transition: all 0.15s;
  }
  .state-seen .check-box { background: #4ade80; border-color: #4ade80; color: #0a0a0f; }
  .state-must .check-box { background: #f5c518; border-color: #f5c518; color: #0a0a0f; }
  .state-rewatch .check-box { background: #a78bfa; border-color: #a78bfa; color: #0a0a0f; }
  .movie-num {
    font-size: 0.7rem;
    color: #444;
    min-width: 22px;
    text-align: right;
  }
  .movie-name { font-size: 0.95rem; transition: color 0.15s; flex: 1; }
  .movie-tag {
    font-size: 0.65rem;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .state-seen .movie-tag { background: #4ade8022; color: #4ade80; }
  .state-must .movie-tag { background: #f5c51822; color: #f5c518; }
  .state-rewatch .movie-tag { background: #a78bfa22; color: #a78bfa; }
  .state-unseen .movie-tag { display: none; }
  .others-dots {
    display: flex;
    gap: 3px;
    align-items: center;
    margin-left: auto;
    flex-shrink: 0;
  }
  .others-dots .odot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
    cursor: default;
    position: relative;
  }
  .odot-seen { background: #4ade80; }
  .odot-must { background: #f5c518; }
  .odot-rewatch { background: #a78bfa; }
  .odot-unseen { background: #333; }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #1a1a2a;
    border-radius: 2px;
    margin-bottom: 1.25rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
    background: linear-gradient(90deg, #4ade80, #f5c518);
  }
  .hidden { display: none !important; }

  /* Name modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: #141420;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    text-align: center;
  }
  .modal h2 {
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    color: #f5c518;
  }
  .modal p { color: #888; font-size: 0.85rem; margin-bottom: 1.25rem; }
  .modal input {
    width: 100%;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0a0a0f;
    color: #e0e0e0;
    font-size: 1rem;
    outline: none;
    margin-bottom: 1rem;
    text-align: center;
  }
  .modal input:focus { border-color: #f5c518; }
  .modal .btn-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
  .modal button {
    padding: 0.5rem 1.5rem;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a2a;
    color: #ccc;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .modal button.primary {
    background: linear-gradient(135deg, #f5c518, #e6a700);
    color: #0a0a0f;
    border: none;
    font-weight: 600;
  }
  .modal button:hover { opacity: 0.85; }
  .modal .existing-users {
    margin-top: 1rem;
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .modal .existing-users button {
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    border-color: #555;
  }

  /* Compare view */
  .compare-section {
    margin-top: 2rem;
    border-top: 1px solid #222;
    padding-top: 1.5rem;
  }
  .compare-section h2 {
    text-align: center;
    font-size: 1.2rem;
    margin-bottom: 1rem;
    color: #e0e0e0;
  }
  .compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  .compare-table th {
    padding: 0.5rem 0.4rem;
    text-align: center;
    color: #f5c518;
    border-bottom: 1px solid #333;
    font-size: 0.75rem;
    position: sticky;
    top: 0;
    background: #0a0a0f;
  }
  .compare-table th:first-child { text-align: left; }
  .compare-table td {
    padding: 0.35rem 0.4rem;
    text-align: center;
    border-bottom: 1px solid #111;
  }
  .compare-table td:first-child {
    text-align: left;
    color: #aaa;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .compare-table tr:hover { background: #161625; }
  .compare-match { background: #4ade8015; }
  .cell-icon { font-size: 0.85rem; }
  .compare-stats {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: #888;
  }
  .compare-stats strong { color: #f5c518; }

  .add-movie-wrap {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .add-movie-wrap input {
    flex: 1;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    border: 1px solid #222;
    background: #141420;
    color: #e0e0e0;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .add-movie-wrap input:focus { border-color: #f5c518; }
  .add-movie-wrap button {
    padding: 0.6rem 1rem;
    border-radius: 8px;
    border: 1px solid #f5c518;
    background: #1a1a2a;
    color: #f5c518;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .add-movie-wrap button:hover { background: #252540; }
  .movie-item.user-added .movie-num {
    color: #f5c518;
  }

  @media (max-width: 500px) {
    body { padding: 1rem 0.5rem; }
    h1 { font-size: 1.4rem; }
    .movie-name { font-size: 0.85rem; }
    .stats { gap: 0.75rem; }
    .stat { min-width: 80px; padding: 0.4rem 0.8rem; }
    .compare-table { font-size: 0.7rem; }
  }
</style>
</head>
<body>

<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <h2>Who's watching?</h2>
    <p>Enter your name to track your movie picks</p>
    <input type="text" id="name-input" placeholder="Your name..." autocomplete="off">
    <div class="btn-row">
      <button class="primary" id="name-go">Let's Go</button>
    </div>
    <div class="existing-users" id="existing-users"></div>
  </div>
</div>

<div class="container" id="main-app" style="display:none;">
  <h1>Movie Checklist</h1>
  <p class="subtitle">Click to cycle: Not Seen &rarr; Seen &rarr; Must See &rarr; Watch Again &rarr; Reset</p>

  <div class="user-bar">
    <span class="current-user" id="display-name"></span>
    <button id="switch-user-btn">Switch User</button>
    <button id="compare-btn">Compare</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num seen-c" id="seen-count">0</div><div class="stat-label">Seen</div></div>
    <div class="stat"><div class="stat-num must-c" id="must-count">0</div><div class="stat-label">Must See</div></div>
    <div class="stat"><div class="stat-num rewatch-c" id="rewatch-count">0</div><div class="stat-label">Watch Again</div></div>
    <div class="stat"><div class="stat-num unseen-c" id="unseen-count">0</div><div class="stat-label">Not Seen</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="legend">
    <span><span class="dot dot-unseen"></span> Not Seen</span>
    <span><span class="dot dot-seen"></span> Seen</span>
    <span><span class="dot dot-must"></span> Must See</span>
    <span><span class="dot dot-rewatch"></span> Watch Again</span>
  </div>

  <div class="controls">
    <button class="active" data-filter="all">All</button>
    <button data-filter="unseen">Not Seen</button>
    <button data-filter="seen">Seen</button>
    <button data-filter="must">Must See</button>
    <button data-filter="rewatch">Watch Again</button>
    <button data-filter="reset" style="margin-left:0.5rem; color:#f55;">Reset All</button>
    <button id="save-btn" style="margin-left:0.5rem; background:#1a2a1a; border-color:#4ade80; color:#4ade80;">Save</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search movies..." autocomplete="off">
  </div>

  <div class="add-movie-wrap">
    <input type="text" id="add-movie-input" placeholder="Add a movie..." autocomplete="off">
    <button id="add-movie-btn">+ Add</button>
  </div>

  <ul class="movie-list" id="movie-list"></ul>

  <div class="compare-section hidden" id="compare-section">
    <h2>Compare</h2>
    <div class="compare-stats" id="compare-stats"></div>
    <div style="overflow-x:auto;">
      <table class="compare-table" id="compare-table"></table>
    </div>
  </div>
</div>

<script>
const BASE_MOVIES = [
  "The Godfather","The Godfather Part II","The Shawshank Redemption","Pulp Fiction",
  "Forrest Gump","The Dark Knight","Fight Club","Goodfellas","Star Wars: A New Hope",
  "The Empire Strikes Back","Jurassic Park","Titanic","The Matrix","Jaws",
  "Back to the Future","Raiders of the Lost Ark","E.T. the Extra-Terrestrial",
  "The Silence of the Lambs","Schindler's List","Saving Private Ryan","Gladiator",
  "Braveheart","The Lord of the Rings: The Fellowship of the Ring",
  "The Lord of the Rings: The Two Towers","The Lord of the Rings: The Return of the King",
  "Inception","Interstellar","The Lion King","Toy Story","Finding Nemo","Shrek",
  "Home Alone","Die Hard","Terminator 2: Judgment Day","Alien","Aliens","Rocky",
  "The Breakfast Club","Ferris Bueller's Day Off","Dirty Dancing","Grease",
  "The Princess Bride","Ghostbusters","Indiana Jones and the Last Crusade",
  "The Sixth Sense","Se7en","The Usual Suspects","Memento","No Country for Old Men",
  "There Will Be Blood","The Departed","Casino","Scarface","Taxi Driver",
  "Apocalypse Now","Full Metal Jacket","The Shining","Psycho","The Exorcist",
  "Halloween","A Clockwork Orange","2001: A Space Odyssey","Blade Runner","Casablanca",
  "Citizen Kane","Gone with the Wind","The Wizard of Oz","Singin' in the Rain",
  "It's a Wonderful Life","Some Like It Hot","12 Angry Men",
  "One Flew Over the Cuckoo's Nest","Good Will Hunting","Dead Poets Society",
  "A Beautiful Mind","The Green Mile","Slumdog Millionaire","La La Land","Whiplash",
  "Parasite","Spirited Away","The Truman Show","Eternal Sunshine of the Spotless Mind",
  "Groundhog Day","Mrs. Doubtfire","The Big Lebowski","Office Space","Anchorman",
  "Superbad","Mean Girls","Clueless","Pretty Woman","When Harry Met Sally",
  "Love Actually","The Notebook","Top Gun",
  "Pirates of the Caribbean: The Curse of the Black Pearl","Avatar",
  "Mad Max: Fury Road","Django Unchained",
  "Rain Man","The Sound of Music","Mary Poppins",
  "Willy Wonka & the Chocolate Factory","The Goonies","Stand by Me","The Karate Kid",
  "Rocky IV","Top Gun: Maverick","Mission: Impossible","Skyfall","Goldfinger",
  "The Bourne Identity","Heat","L.A. Confidential","Reservoir Dogs","Kill Bill: Vol. 1",
  "Inglourious Basterds","Once Upon a Time in Hollywood","The Wolf of Wall Street",
  "Catch Me If You Can","Jerry Maguire","A Few Good Men","The Fugitive","Speed",
  "Point Break","The Rock","Con Air","Independence Day","Men in Black","The Mummy",
  "National Treasure","Ocean's Eleven","Now You See Me","The Prestige","Shutter Island",
  "Gone Girl","Zodiac","Prisoners","Mystic River","Million Dollar Baby","Unforgiven",
  "The Outsiders","Cool Hand Luke","Cinema Paradiso",
  "The Good, the Bad and the Ugly","Once Upon a Time in the West","Lawrence of Arabia",
  "The Bridge on the River Kwai","Doctor Zhivago","Ben-Hur","Spartacus",
  "The Great Escape","Platoon","Born on the Fourth of July","The Deer Hunter",
  "Black Hawk Down","1917","Dunkirk","Hacksaw Ridge","American History X",
  "American Beauty","Requiem for a Dream","Trainspotting","Donnie Darko",
  "Pan's Labyrinth","Am\u00e9lie","Life Is Beautiful","City of God","Oldboy",
  "Crouching Tiger, Hidden Dragon","Hero","Your Name","Princess Mononoke",
  "My Neighbor Totoro","Howl's Moving Castle","WALL-E","Up","Ratatouille",
  "Monsters, Inc.","The Incredibles","Inside Out","Coco","How to Train Your Dragon",
  "Beauty and the Beast","Aladdin","The Little Mermaid","Frozen","Moana",
  "Despicable Me","The Sandlot","Big","Edward Scissorhands","Beetlejuice",
  "The Nightmare Before Christmas","Gremlins","Jumanji","Elf",
  "National Lampoon's Christmas Vacation","A Christmas Story"
];

/* ALL_USERS is baked in by the save function: { "Shaw": { "The Godfather": "seen", ... }, ... } */
const ALL_USERS = {};
/* CUSTOM_MOVIES is baked in by the save function: ["Movie A", "Movie B"] */
const CUSTOM_MOVIES = [];

// Merge: custom movies at the top, then base movies (deduped)
let MOVIES = [];
function rebuildMovieList() {
  const customLocal = JSON.parse(localStorage.getItem('movie-checklist-custom') || '[]');
  const allCustom = [...new Set([...customLocal, ...CUSTOM_MOVIES])];
  // Save merged back to localStorage
  localStorage.setItem('movie-checklist-custom', JSON.stringify(allCustom));
  const baseSet = new Set(BASE_MOVIES.map(m => m.toLowerCase()));
  // Custom movies that aren't already in base go to top
  const uniqueCustom = allCustom.filter(m => !baseSet.has(m.toLowerCase()));
  MOVIES = [...uniqueCustom, ...BASE_MOVIES];
}
rebuildMovieList();

const STATES = ['unseen', 'seen', 'must', 'rewatch'];
const LABELS = { unseen: '', seen: 'Seen', must: 'Must See', rewatch: 'Watch Again' };
const ICONS = { unseen: '', seen: '\u2713', must: '\u2605', rewatch: '\u21BB' };
const STATE_COLORS = { unseen: '#333', seen: '#4ade80', must: '#f5c518', rewatch: '#a78bfa' };
const CELL_ICONS = { unseen: '\u2014', seen: '\u2713', must: '\u2605', rewatch: '\u21BB' };

let currentUser = '';
let movieStates = {};

function storageKey() { return 'movie-checklist-' + currentUser.toLowerCase(); }

function loadState() {
  movieStates = {};
  try {
    const saved = localStorage.getItem(storageKey());
    if (saved) movieStates = JSON.parse(saved);
  } catch(e) {}
  // Fall back to baked-in data for this user
  const bakedKey = Object.keys(ALL_USERS).find(k => k.toLowerCase() === currentUser.toLowerCase());
  if (bakedKey && Object.keys(movieStates).length === 0) {
    Object.assign(movieStates, ALL_USERS[bakedKey]);
  }
  MOVIES.forEach(m => { if (!movieStates[m]) movieStates[m] = 'unseen'; });
}

function saveState() {
  try { localStorage.setItem(storageKey(), JSON.stringify(movieStates)); } catch(e) {}
}

function cycleState(movie) {
  const cur = STATES.indexOf(movieStates[movie]);
  movieStates[movie] = STATES[(cur + 1) % 4];
  saveState();
  render();
}

let currentFilter = 'all';
let searchTerm = '';

function getOtherUsers() {
  const names = new Set(Object.keys(ALL_USERS));
  // Also check localStorage for users not yet saved/deployed
  const skip = ['movie-checklist-custom', 'movie-checklist-last-user'];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('movie-checklist-') && !skip.includes(key)) {
      const name = key.replace('movie-checklist-', '');
      if (name) names.add(name);
    }
  }
  return [...names].filter(n => n.toLowerCase() !== currentUser.toLowerCase());
}

function render() {
  const list = document.getElementById('movie-list');
  const items = list.querySelectorAll('.movie-item');
  const others = getOtherUsers();

  items.forEach(el => {
    const movie = el.dataset.movie;
    const state = movieStates[movie];
    el.className = `movie-item state-${state}`;
    el.querySelector('.check-box').textContent = ICONS[state];
    el.querySelector('.movie-tag').textContent = LABELS[state];

    // Render other users' dots
    const dotsEl = el.querySelector('.others-dots');
    if (others.length > 0) {
      dotsEl.innerHTML = others.map(name => {
        const uKey = Object.keys(ALL_USERS).find(k => k.toLowerCase() === name.toLowerCase());
        const uStates = ALL_USERS[uKey] || {};
        const s = uStates[movie] || 'unseen';
        return '<span class="odot odot-' + s + '" title="' + (uKey || name) + ': ' + (LABELS[s] || 'Not Seen') + '"></span>';
      }).join('');
    } else {
      dotsEl.innerHTML = '';
    }

    const matchesFilter = currentFilter === 'all' || currentFilter === state;
    const matchesSearch = !searchTerm || movie.toLowerCase().includes(searchTerm);
    el.classList.toggle('hidden', !matchesFilter || !matchesSearch);
  });

  updateStats();
}

function updateStats() {
  const counts = { seen: 0, must: 0, rewatch: 0, unseen: 0 };
  MOVIES.forEach(m => counts[movieStates[m]]++);
  document.getElementById('seen-count').textContent = counts.seen;
  document.getElementById('must-count').textContent = counts.must;
  document.getElementById('rewatch-count').textContent = counts.rewatch;
  document.getElementById('unseen-count').textContent = counts.unseen;
  const pct = ((counts.seen + counts.must + counts.rewatch) / MOVIES.length) * 100;
  document.getElementById('progress').style.width = pct + '%';
}

function isCustomMovie(movie) {
  return !BASE_MOVIES.find(m => m.toLowerCase() === movie.toLowerCase());
}

function buildList() {
  const list = document.getElementById('movie-list');
  list.innerHTML = '';
  MOVIES.forEach((movie, i) => {
    const li = document.createElement('li');
    const isCustom = isCustomMovie(movie);
    li.className = 'movie-item state-' + movieStates[movie] + (isCustom ? ' user-added' : '');
    li.dataset.movie = movie;
    li.innerHTML =
      '<span class="movie-num">' + (isCustom ? '\u2605' : (i + 1)) + '</span>' +
      '<span class="check-box">' + ICONS[movieStates[movie]] + '</span>' +
      '<span class="movie-name">' + movie + '</span>' +
      '<span class="movie-tag">' + LABELS[movieStates[movie]] + '</span>' +
      '<span class="others-dots"></span>';
    li.addEventListener('click', () => cycleState(movie));
    list.appendChild(li);
  });
}

function buildCompare() {
  const section = document.getElementById('compare-section');
  const table = document.getElementById('compare-table');
  const statsEl = document.getElementById('compare-stats');
  const allNames = [currentUser, ...getOtherUsers()];

  if (allNames.length < 2) {
    statsEl.innerHTML = '<span>No other users to compare with yet. Have someone else fill it out and save!</span>';
    table.innerHTML = '';
    return;
  }

  // Gather all states
  const allData = {};
  allNames.forEach(name => {
    const lc = name.toLowerCase();
    // Current user: use live state
    if (lc === currentUser.toLowerCase()) {
      allData[name] = { ...movieStates };
    } else {
      const uKey = Object.keys(ALL_USERS).find(k => k.toLowerCase() === lc);
      allData[name] = uKey ? { ...ALL_USERS[uKey] } : {};
    }
  });

  // Stats
  let bothSeen = 0, bothMust = 0;
  if (allNames.length === 2) {
    const [a, b] = allNames;
    MOVIES.forEach(m => {
      const sa = allData[a][m] || 'unseen';
      const sb = allData[b][m] || 'unseen';
      if (sa === sb && sa === 'seen') bothSeen++;
      if (sa === sb && sa === 'must') bothMust++;
    });
    statsEl.innerHTML =
      '<span>Both seen: <strong>' + bothSeen + '</strong></span>' +
      '<span>Both must see: <strong>' + bothMust + '</strong></span>';
  } else {
    let allMatch = 0;
    MOVIES.forEach(m => {
      const states = allNames.map(n => allData[n][m] || 'unseen');
      if (states.every(s => s === states[0] && s !== 'unseen')) allMatch++;
    });
    statsEl.innerHTML = '<span>All agree (non-blank): <strong>' + allMatch + '</strong></span>';
  }

  // Table
  let html = '<thead><tr><th>Movie</th>';
  allNames.forEach(n => { html += '<th>' + n + '</th>'; });
  html += '</tr></thead><tbody>';

  MOVIES.forEach(movie => {
    const states = allNames.map(n => allData[n][movie] || 'unseen');
    const nonUnseen = states.filter(s => s !== 'unseen');
    const match = nonUnseen.length >= 2 && nonUnseen.every(s => s === nonUnseen[0]);
    html += '<tr' + (match ? ' class="compare-match"' : '') + '>';
    html += '<td>' + movie + '</td>';
    states.forEach(s => {
      html += '<td><span class="cell-icon" style="color:' + STATE_COLORS[s] + '">' + CELL_ICONS[s] + '</span></td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
}

// --- Name modal ---
function showNameModal() {
  const modal = document.getElementById('name-modal');
  const existing = document.getElementById('existing-users');
  modal.classList.remove('hidden');
  modal.style.display = '';
  document.getElementById('main-app').style.display = 'none';

  // Show existing users as quick-select buttons
  const names = Object.keys(ALL_USERS);
  // Also from localStorage (skip non-user keys)
  const skipKeys = ['movie-checklist-custom', 'movie-checklist-last-user'];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('movie-checklist-') && !skipKeys.includes(key)) {
      const n = key.replace('movie-checklist-', '');
      if (n && !names.find(x => x.toLowerCase() === n.toLowerCase())) names.push(n);
    }
  }
  if (names.length > 0) {
    existing.innerHTML = names.map(n =>
      '<button class="pick-user">' + n + '</button>'
    ).join('');
    existing.querySelectorAll('.pick-user').forEach(btn => {
      btn.addEventListener('click', () => {
        startAsUser(btn.textContent.trim());
      });
    });
  } else {
    existing.innerHTML = '';
  }
}

function startAsUser(name) {
  currentUser = name;
  localStorage.setItem('movie-checklist-last-user', name);
  document.getElementById('name-modal').style.display = 'none';
  document.getElementById('main-app').style.display = '';
  document.getElementById('display-name').textContent = name;
  loadState();
  buildList();
  render();
  document.getElementById('compare-section').classList.add('hidden');
}

document.getElementById('name-go').addEventListener('click', () => {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { document.getElementById('name-input').focus(); return; }
  startAsUser(name);
});

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('name-go').click();
});

document.getElementById('switch-user-btn').addEventListener('click', () => {
  showNameModal();
  document.getElementById('name-input').value = '';
  document.getElementById('name-input').focus();
});

document.getElementById('compare-btn').addEventListener('click', () => {
  const section = document.getElementById('compare-section');
  section.classList.toggle('hidden');
  if (!section.classList.contains('hidden')) buildCompare();
});

// --- Filter controls ---
document.querySelectorAll('.controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    if (f === 'reset') {
      if (confirm('Reset all movies to Not Seen?')) {
        MOVIES.forEach(m => movieStates[m] = 'unseen');
        saveState();
        render();
      }
      return;
    }
    if (!f) return;
    document.querySelectorAll('.controls button[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = f;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  render();
});

// --- Add Movie ---
function addMovie(title) {
  title = title.trim();
  if (!title) return;
  // Check for duplicates (case-insensitive)
  if (MOVIES.find(m => m.toLowerCase() === title.toLowerCase())) return;
  // Add to custom list in localStorage
  const customLocal = JSON.parse(localStorage.getItem('movie-checklist-custom') || '[]');
  customLocal.push(title);
  localStorage.setItem('movie-checklist-custom', JSON.stringify(customLocal));
  // Rebuild and re-render
  rebuildMovieList();
  movieStates[title] = 'unseen';
  saveState();
  buildList();
  render();
}

document.getElementById('add-movie-btn').addEventListener('click', () => {
  const input = document.getElementById('add-movie-input');
  addMovie(input.value);
  input.value = '';
  input.focus();
});

document.getElementById('add-movie-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    addMovie(e.target.value);
    e.target.value = '';
  }
});

// --- Save (redeploy) ---
document.getElementById('save-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-btn');
  const orig = btn.textContent;
  btn.textContent = 'Deploying...';
  btn.disabled = true;
  btn.style.opacity = '0.6';
  const customLocal = JSON.parse(localStorage.getItem('movie-checklist-custom') || '[]');
  try {
    const res = await fetch('/.netlify/functions/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: currentUser, states: movieStates, customMovies: customLocal }),
    });
    const data = await res.json();
    if (data.success) {
      btn.textContent = 'Saved!';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.opacity = '1'; }, 3000);
    } else {
      btn.textContent = 'Error';
      btn.style.borderColor = '#f55';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.opacity = '1'; btn.style.borderColor = '#4ade80'; }, 3000);
    }
  } catch(e) {
    btn.textContent = 'Error';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.opacity = '1'; }, 3000);
  }
});

// --- Init ---
const lastUser = localStorage.getItem('movie-checklist-last-user');
if (lastUser) {
  document.getElementById('name-input').value = lastUser;
}
showNameModal();
</script>
